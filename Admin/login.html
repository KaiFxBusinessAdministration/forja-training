<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso administrativo | FORJA TRAINING</title>
<link rel="icon" type="image/png" href="../Assets/img/forja-favicon.png?v=forja-favicon-2">
<link rel="stylesheet" href="../Assets/css/style.css?v=admin-login-1">
<script src="../Assets/js/vendor/supabase.min.js"></script>
<script src="../Assets/js/backend-config.js"></script>
<script src="../Assets/js/backend.js"></script>
</head>
<body class="landing auth-screen" style="--landing-image:url('../Assets/img/trainer-dashboard.webp')">
<img class="landing-bg" src="../Assets/img/trainer-dashboard.webp" alt="Forja Training">
<div class="landing-container">
<div class="logo-box"><a class="auth-logo" href="../role.html" aria-label="Volver a seleccionar rol"><img src="../Assets/img/forja-training-logo.png?v=forja-logo-1" alt="FORJA TRAINING"></a><p>Acceso administrativo</p></div>
<form class="client-form" id="adminLoginForm" style="width:100%;max-width:460px;text-align:left"><div><label for="adminEmail">Correo administrativo</label><input id="adminEmail" type="email" autocomplete="username" required></div><div><label for="adminPassword">Contraseña</label><input id="adminPassword" type="password" autocomplete="current-password" required></div><button class="btn-primary" type="submit">Entrar al panel</button><p class="form-status" id="adminStatus" aria-live="polite"></p></form>
<a class="btn-secondary" href="../role.html">Cambiar rol</a>
</div>
<script>const form=document.getElementById('adminLoginForm'),status=document.getElementById('adminStatus');form.addEventListener('submit',async event=>{event.preventDefault();status.textContent='Comprobando acceso...';try{if(!window.FLOW_BACKEND?.ready)throw new Error('Supabase no está disponible.');const {data,error}=await window.FLOW_BACKEND.client.auth.signInWithPassword({email:document.getElementById('adminEmail').value.trim(),password:document.getElementById('adminPassword').value});if(error)throw error;const {data:profile,error:profileError}=await window.FLOW_BACKEND.client.from('profiles').select('role').eq('id',data.user.id).single();if(profileError||profile?.role!=='admin'){await window.FLOW_BACKEND.client.auth.signOut();throw new Error('Esta cuenta no tiene permisos administrativos.');}window.location.href='dashboard.html';}catch(error){status.textContent=error.message.includes('Invalid login credentials')?'Correo o contraseña incorrectos.':error.message;}});</script>
</body>
</html>
