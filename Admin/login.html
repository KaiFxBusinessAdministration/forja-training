<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../Assets/img/forja-favicon.png?v=forja-favicon-2">
<title>Acceso administrativo | FORJA TRAINING</title>
<link rel="stylesheet" href="../Assets/css/style.css?v=admin-login-1">
<script src="../Assets/js/vendor/supabase.min.js"></script>
<script src="../Assets/js/backend-config.js"></script>
<script src="../Assets/js/backend.js"></script>
<script src="../Assets/js/auth.js?v=admin-login-1"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="landing auth-screen" style="--landing-image:url('../Assets/img/role-coach.webp')">
<img class="landing-bg" src="../Assets/img/role-coach.webp" alt="Acceso administrativo FORJA TRAINING" fetchpriority="high" decoding="async">
<div class="landing-container">
<div class="logo-box">
<a class="auth-logo" href="../role.html" aria-label="Volver a seleccionar rol"><img src="../Assets/img/forja-training-logo.png?v=forja-logo-1" alt="FORJA TRAINING"></a>
<p>Acceso administrativo</p>
</div>
<form class="client-form" id="adminLogin" style="width:100%;max-width:460px;text-align:left">
<div><label for="adminUsername">Usuario</label><input id="adminUsername" autocomplete="username" placeholder="Administrador" required></div>
<div><label for="adminPassword">Contraseña</label><input id="adminPassword" type="password" autocomplete="current-password" required></div>
<div id="turnstileAdmin" class="turnstile-slot"></div>
<button class="btn-primary" type="submit">Entrar al panel</button>
<p class="form-status" id="adminStatus" aria-live="polite"></p>
</form>
<a class="btn-secondary" href="../role.html">Volver a seleccionar rol</a>
</div>
<script>
const form=document.getElementById("adminLogin"),statusText=document.getElementById("adminStatus");let captchaToken="";
window.FLOW_AUTH.renderCaptcha("turnstileAdmin",token=>captchaToken=token);
form.addEventListener("submit",async event=>{event.preventDefault();statusText.textContent="Comprobando acceso...";try{if(!captchaToken)throw new Error("Confirma la verificación de seguridad.");const username=document.getElementById("adminUsername").value.trim().toLowerCase();const profile=await window.FLOW_AUTH.signIn(`${username}@forjaentrenamiento.vercel.app`,document.getElementById("adminPassword").value,"admin",captchaToken);sessionStorage.setItem("flowAuthRole",profile.role);location.href="dashboard.html";}catch(error){statusText.textContent=error.message.includes("Invalid login credentials")?"Usuario o contraseña incorrectos.":error.message;}});
</script>
</body>
</html>
