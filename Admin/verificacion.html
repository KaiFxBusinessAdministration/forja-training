<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación | FORJA TRAINING</title><link rel="stylesheet" href="../Assets/css/style.css"><script src="../Assets/js/vendor/supabase.min.js"></script><script src="../Assets/js/backend-config.js"></script><script src="../Assets/js/backend.js"></script></head><body class="dashboard-body"><div class="app-container"><aside class="sidebar"><div class="brand"><a class="brand-home" href="../index.html" aria-label="Ir al inicio"><h2>FORJA TRAINING</h2><span>Administración</span></a></div><nav><a href="dashboard.html">Resumen</a><a class="active" href="verificacion.html">Verificación</a><a href="../index.html">Salir</a></nav></aside><main class="main-content"><header class="topbar"><div><h1>Validación documental</h1><p>Revisa la información antes de habilitar un entrenador.</p></div></header><section class="dashboard-panel"><div id="verificationList" class="activity"><p class="empty-state">Cargando...</p></div></section></main></div><script>
const api=window.FLOW_BACKEND,box=document.getElementById("verificationList");function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}(async()=>{try{const user=await api.requireUser();const {data:me}=await api.client.from("profiles").select("role").eq("id",user.id).single();if(me?.role!=="admin")throw new Error("No autorizado");const {data,error}=await api.client.from("profiles").select("id,full_name,trainer_specialties,trainer_certifications,trainer_certificate_url,trainer_verification_status").eq("role","trainer").order("full_name");if(error)throw error;box.innerHTML=data?.length?data.map(x=>`<article class="dashboard-panel"><h2>${esc(x.full_name)}</h2><p><strong>Estado:</strong> ${esc(x.trainer_verification_status)}</p><p><strong>Especialidades:</strong> ${esc(x.trainer_specialties||"No registradas")}</p><p><strong>Certificaciones:</strong> ${esc(x.trainer_certifications||"No registradas")}</p>${x.trainer_certificate_url?`<p><a href="${esc(x.trainer_certificate_url)}" target="_blank" rel="noopener">Abrir respaldo</a></p>`:""}<div class="form-actions"><button class="btn-primary" data-status="verified" data-id="${x.id}">Verificar</button><button class="btn-secondary danger" data-status="rejected" data-id="${x.id}">Rechazar</button></div></article>`).join(""):'<p class="empty-state">No hay entrenadores para revisar.</p>';box.querySelectorAll("[data-status]").forEach(button=>button.addEventListener("click",async()=>{button.disabled=true;const result=await api.client.from("profiles").update({trainer_verification_status:button.dataset.status}).eq("id",button.dataset.id);if(result.error){button.disabled=false;return;}location.reload();}));}catch(error){console.error(error);box.innerHTML='<p class="empty-state">No autorizado o no se pudo cargar la verificación.</p>';}})();
</script></body></html>
