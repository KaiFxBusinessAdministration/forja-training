<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagos manuales | FORJA TRAINING</title><link rel="stylesheet" href="../Assets/css/style.css"><script src="../Assets/js/vendor/supabase.min.js"></script><script src="../Assets/js/backend-config.js"></script><script src="../Assets/js/backend.js"></script></head><body class="dashboard-body"><div class="app-container"><aside class="sidebar"><div class="brand"><h2>FORJA TRAINING</h2></div><nav><a href="dashboard.html">Dashboard</a><a href="clientes.html">Clientes</a><a class="active" href="pagos.html">Pagos</a><a href="entrenamiento.html">Entrenamientos</a><a href="alimentacion.html">Alimentación</a><a href="../role.html">Cambiar rol</a></nav></aside><main class="main-content"><header class="topbar"><div><h1>Pagos manuales</h1><p>Registra pagos recibidos sin activar cobros automáticos.</p></div></header><section class="dashboard-panel"><form id="paymentForm" class="client-form" style="max-width:680px;text-align:left"><label for="paymentClient">Atleta</label><select id="paymentClient" required><option value="">Cargando atletas...</option></select><label for="paymentAmount">Monto</label><input id="paymentAmount" type="number" min="0" step="0.01" required><label for="paymentConcept">Concepto</label><input id="paymentConcept" placeholder="Mensualidad, sesión o plan" required><label for="paymentStatus">Estado</label><select id="paymentStatus"><option value="paid">Pagado</option><option value="pending">Pendiente</option><option value="cancelled">Cancelado</option></select><label for="paymentNotes">Notas</label><textarea id="paymentNotes" rows="3"></textarea><button class="btn-primary" type="submit">Guardar pago</button><p class="form-status" id="paymentStatusText" aria-live="polite"></p></form></section><section class="dashboard-panel"><h2>Historial registrado</h2><div id="paymentHistory" class="activity"><p class="empty-state">Cargando...</p></div></section></main></div><script>
const api=window.FLOW_BACKEND,form=document.getElementById("paymentForm"),statusText=document.getElementById("paymentStatusText"),clientSelect=document.getElementById("paymentClient"),history=document.getElementById("paymentHistory");
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
(async()=>{if(!api?.ready)return;const user=await api.requireUser();const {data:links}=await api.client.from("trainer_clients").select("client_id,profiles!trainer_clients_client_id_fkey(full_name)").eq("trainer_id",user.id).eq("status","active");clientSelect.innerHTML=(links||[]).map(x=>`<option value="${x.client_id}">${esc(x.profiles?.full_name||"Atleta")}</option>`).join("")||'<option value="">No hay atletas aceptados</option>';const {data:rows}=await api.client.from("trainer_payments").select("amount,concept,status,paid_at,notes,profiles!trainer_payments_client_id_fkey(full_name)").eq("trainer_id",user.id).order("paid_at",{ascending:false});history.innerHTML=rows?.length?rows.map(x=>`<p><strong>${esc(x.profiles?.full_name)}</strong> · $${Number(x.amount).toFixed(2)} · ${esc(x.concept)} · ${esc(x.status)}</p>`).join(""):'<p class="empty-state">Todavía no hay pagos registrados.</p>';form.addEventListener("submit",async e=>{e.preventDefault();statusText.textContent="Guardando...";const result=await api.client.from("trainer_payments").insert({trainer_id:user.id,client_id:clientSelect.value,amount:Number(document.getElementById("paymentAmount").value),concept:document.getElementById("paymentConcept").value.trim(),status:document.getElementById("paymentStatus").value,notes:document.getElementById("paymentNotes").value.trim()});statusText.textContent=result.error?"No se pudo guardar el pago.":"Pago registrado correctamente.";if(!result.error)setTimeout(()=>location.reload(),500);});})();
</script></body></html>
