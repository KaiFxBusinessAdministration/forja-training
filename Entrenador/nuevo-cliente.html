<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../Assets/img/forja-favicon.png?v=forja-favicon-2">

<title>Nuevo Cliente | Flow Fitness</title>

<link rel="stylesheet" href="../Assets/css/style.css">

</head>


<body class="dashboard-body">


<div class="app-container">


<aside class="sidebar">


<div class="brand">

<h2>FORJA TRAINING</h2>

<span>Trainer System</span>

</div>


<nav>

<a href="dashboard.html">
Dashboard
</a>

<a class="active" href="clientes.html">
Clientes
</a>

<a href="entrenamiento.html">
Entrenamientos
</a>

<a href="alimentacion.html">
Alimentación
</a>

<a href="reportes.html">
Reportes
</a>

</nav>


</aside>



<main class="main-content">


<header class="topbar">

<div>

<h1>
Nuevo Cliente
</h1>

<p>
Registro de alumno
</p>

</div>


</header>

<section class="page-hero compact">
<div class="page-hero-content">
<h2>Onboarding físico bien dirigido</h2>
<p>Registra los datos base del alumno para diseñar un plan medible, claro y personalizado.</p>
</div>
<img src="../Assets/img/trainer-new-client.jpg" alt="Entrenador masculino explicando el plan inicial a un cliente masculino">
</section>



<section class="dashboard-panel">


<form class="client-form" id="formCliente">


<div class="form-grid">


<div>

<label>
Nombre completo
</label>

<input 
type="text"
id="nombre"
placeholder="Ej: Pedro Gómez"
required
>

</div>



<div>

<label>
Edad
</label>

<input 
type="number"
id="edad"
min="13"
max="100"
placeholder="30"
required
>

</div>



<div>

<label>
Peso (kg)
</label>

<input 
type="number"
id="peso"
min="20"
max="300"
placeholder="75"
required
>

</div>



<div>

<label>
Altura (m)
</label>

<input 
type="number"
step="0.01"
id="altura"
min="1"
max="2.5"
placeholder="1.75"
required
>

</div>



<div>

<label>
Objetivo
</label>


<select id="objetivo">


<option>
Hipertrofia
</option>


<option>
Pérdida de grasa
</option>


<option>
Fuerza
</option>


<option>
Tonificación
</option>


</select>


</div>



<div>

<label>
Estado
</label>


<select id="estado">


<option>
Activo
</option>


<option>
Pendiente
</option>


</select>


</div>


</div>



<button type="submit" class="btn-primary">

Guardar Cliente

</button>



</form>


</section>


</main>


</div>



<script src="../Assets/js/app.js"></script>


<script>


document
.getElementById("formCliente")
.addEventListener("submit",(e)=>{


e.preventDefault();

const clientes = JSON.parse(localStorage.getItem("flowClientesAdicionales") || "[]");
const nuevoCliente = {
id: Date.now(),
nombre: document.getElementById("nombre").value.trim(),
edad: Number(document.getElementById("edad").value),
peso: Number(document.getElementById("peso").value),
altura: Number(document.getElementById("altura").value),
objetivo: document.getElementById("objetivo").value,
estado: document.getElementById("estado").value,
entrenador: "Andrés Vega"
};

clientes.push(nuevoCliente);
localStorage.setItem("flowClientesAdicionales",JSON.stringify(clientes));



window.location.href="clientes.html";


});


</script>



</body>

</html>
