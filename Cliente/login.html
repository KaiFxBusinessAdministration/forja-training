<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../Assets/img/forja-favicon.png?v=forja-favicon-2">
<title>Login Cliente | Flow Fitness</title>
<link rel="stylesheet" href="../Assets/css/style.css?v=forja-logo-1">
<script src="../Assets/js/vendor/supabase.min.js"></script>
<script src="../Assets/js/backend-config.js"></script>
<script src="../Assets/js/backend.js"></script>
<script src="../Assets/js/auth.js?v=profile-real-1"></script>
</head>
<body class="landing auth-screen" style="--landing-image:url('../Assets/img/client-login-reserved.png?v=client-photo-1')">
<img class="landing-bg" src="../Assets/img/client-login-reserved.png?v=client-photo-1" alt="Entrenador masculino corrigiendo la técnica de un cliente masculino durante un ejercicio">
<div class="landing-container">
<div class="logo-box">
<a class="auth-logo" href="../index.html" aria-label="Volver al home"><img src="../Assets/img/forja-training-logo.png?v=forja-logo-1" alt="FORJA TRAINING"></a>
<p>Acceso de cliente</p>
</div>
<form class="client-form" id="loginCliente" style="width:100%;max-width:460px;text-align:left">
<div>
<label for="loginEmail">Email</label>
<input id="loginEmail" type="email" placeholder="cliente@flowfitness.com" required>
</div>
<div>
<label for="loginPassword">Contraseña</label>
<input id="loginPassword" type="password" placeholder="••••••••" required>
</div>
<button class="btn-primary" type="submit">Entrar al portal</button>
<button class="btn-secondary" type="button" id="recuperarPassword">Recuperar contraseña</button>
<div class="oauth-actions" aria-label="Accesos sociales">
<button class="oauth-btn" type="button" id="googleAccess" aria-label="Continuar con Google"><span class="oauth-icon google-icon" aria-hidden="true">G</span><span>Google</span></button>
<button class="oauth-btn" type="button" id="githubAccess" aria-label="Continuar con GitHub"><svg class="oauth-icon github-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.25a9.75 9.75 0 0 0-3.08 19c.49.09.67-.21.67-.47v-1.67c-2.73.59-3.3-1.16-3.3-1.16-.45-1.14-1.1-1.45-1.1-1.45-.9-.62.07-.61.07-.61.99.07 1.51 1.02 1.51 1.02.88 1.51 2.3 1.08 2.86.83.09-.65.34-1.08.62-1.33-2.18-.25-4.47-1.09-4.47-4.86 0-1.07.38-1.95 1.02-2.64-.1-.25-.44-1.25.1-2.6 0 0 .83-.26 2.68 1.01A9.3 9.3 0 0 1 12 6.99c.84 0 1.68.11 2.47.33 1.85-1.27 2.68-1.01 2.68-1.01.54 1.35.2 2.35.1 2.6.64.69 1.02 1.57 1.02 2.64 0 3.78-2.3 4.61-4.49 4.86.35.3.66.89.66 1.8v2.67c0 .26.18.57.68.47A9.75 9.75 0 0 0 12 2.25Z"/></svg><span>GitHub</span></button>
</div>
<a class="register-icon-link" href="../registro.html?role=client" aria-label="Crear cuenta de atleta" title="Crear cuenta de atleta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17v13h-17z"/><path d="m4 6 8 6 8-6"/></svg></a>
<p class="form-status" id="loginEstado" aria-live="polite"></p>
</form>
<form class="client-form auth-reset-form" id="resetPasswordForm" hidden style="width:100%;max-width:460px;text-align:left">
<div><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" minlength="8" required></div>
<div><label for="confirmPassword">Repetir contraseña</label><input id="confirmPassword" type="password" minlength="8" required></div>
<button class="btn-primary" type="submit">Guardar nueva contraseña</button>
<p class="form-status" id="resetEstado" aria-live="polite"></p>
</form>
<a class="btn-secondary" href="../role.html">Cambiar rol</a>
</div>
<script>
const loginForm=document.getElementById("loginCliente");
const loginEstado=document.getElementById("loginEstado");
const resetForm=document.getElementById("resetPasswordForm");
const resetEstado=document.getElementById("resetEstado");
async function oauthReturn(){if(new URLSearchParams(location.search).get("oauth")!=="1")return;try{const profile=await window.FLOW_AUTH.finishOAuth("client");sessionStorage.setItem("flowClienteActivoId",profile.id);location.href=window.FLOW_AUTH.destination(profile.role);}catch(error){loginEstado.textContent="La cuenta no tiene un perfil de atleta autorizado en FORJA.";console.error(error);}}
document.getElementById("googleAccess").addEventListener("click",()=>window.FLOW_AUTH.signInWithProvider("google","client").catch(error=>loginEstado.textContent=error.message));
document.getElementById("githubAccess").addEventListener("click",()=>window.FLOW_AUTH.signInWithProvider("github","client").catch(error=>loginEstado.textContent=error.message));
oauthReturn();
if(window.location.hash.includes("access_token") || new URLSearchParams(window.location.search).get("reset")==="1"){
loginForm.hidden=true;
document.getElementById("recuperarPassword").hidden=true;
resetForm.hidden=false;
document.querySelector(".logo-box p").textContent="Cambia tu contraseña";
}
loginForm.addEventListener("submit",async(event)=>{
event.preventDefault();
loginEstado.textContent="Comprobando acceso...";
try{
const profile=await window.FLOW_AUTH.signIn(document.getElementById("loginEmail").value.trim(),document.getElementById("loginPassword").value,"client");
sessionStorage.setItem("flowClienteActivoId",profile.id);
window.location.href=window.FLOW_AUTH.destination(profile.role);
}catch(error){
loginEstado.textContent=error.message.includes("Invalid login credentials") ? "Correo o contraseña incorrectos." : error.message;
}
});
document.getElementById("recuperarPassword").addEventListener("click",async()=>{
const email=document.getElementById("loginEmail").value.trim();
if(!email){loginEstado.textContent="Escribe tu correo para recuperar la contraseña.";return;}
try{await window.FLOW_AUTH.resetPassword(email);loginEstado.textContent="Te enviamos un enlace para recuperar tu contraseña.";}catch(error){loginEstado.textContent=error.message;}
});
resetForm.addEventListener("submit",async(event)=>{
event.preventDefault();
const password=document.getElementById("newPassword").value;
if(password!==document.getElementById("confirmPassword").value){resetEstado.textContent="Las contraseñas no coinciden.";return;}
resetEstado.textContent="Guardando...";
try{await window.FLOW_AUTH.updatePassword(password);resetEstado.textContent="Contraseña actualizada. Ya puedes iniciar sesión.";resetForm.reset();}catch(error){resetEstado.textContent=error.message;}
});
</script>
</body>
</html>
